version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # Qdrant (Optional - Local Mode)
  # Uncomment if NOT using Qdrant Cloud free tier.
  # Comment out if using cloud.qdrant.io
  # ===========================================
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: rag-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"  # gRPC
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   environment:
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   restart: unless-stopped

volumes:
  redis_data:
    driver: local
  # qdrant_data:
  #   driver: local
